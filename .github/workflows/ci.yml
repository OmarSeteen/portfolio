name: ci
on: [push, pull_request]

# Least privilege: every job can read the code and nothing more. deploy widens its own.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m black --check .
      - run: python -m pip_audit --require-hashes -r requirements.txt
      # Backstop only. The pre-commit hook is what stops a phone number before it is pushed.
      - run: python privacy_scan.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run lint
        working-directory: site
      - run: npm run format:check
        working-directory: site
      - run: npm audit
        working-directory: site

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          # Until omarseteen.space is connected the site lives at
          # omarseteen.github.io/portfolio/. Delete this line the day the domain goes on.
          SITE_BASE: /portfolio/
      # The exact files deploy publishes. Uploaded on every run; only deploy uses it.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: site/dist }

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: python -m pytest tests/e2e -m e2e

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npm run lighthouse
        working-directory: site

  deploy:
    # Only main publishes, and only after every check passed. A failed check leaves the
    # previous version of the site live.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, build, e2e, lighthouse]
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish to GitHub Pages
      id-token: write # prove to Pages that this run is the one deploying
    # Two publishes close together deploy one after the other, never over each other.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
